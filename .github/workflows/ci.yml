name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - name: Record toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all supported backends
        run: moon check --target all --deny-warn
      - name: Test all supported backends
        run: moon test --target all --deny-warn
      - name: Build CLI
        run: moon build --target native --deny-warn
      - name: Build Node CLI
        run: moon build cmd/main --target js --deny-warn
      - name: Check generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify the three examples
        run: python tools/examples.py --moonar _build/native/debug/build/cmd/main/main.exe
      - name: Verify native and Node filesystem workflows
        run: python tools/verify_io.py --moonar _build/native/debug/build/cmd/main/main.exe --node-entry _build/js/debug/build/cmd/main/main.js
      - name: Verify MSVC static and import library consumers
        if: runner.os == 'Windows'
        run: python tools/verify_windows.py --moonar _build/native/debug/build/cmd/main/main.exe
      - name: Verify native Apple toolchain consumers
        if: runner.os == 'macOS'
        run: python tools/verify_macos.py --moonar _build/native/debug/build/cmd/main/main.exe
      - name: Run public API consumer
        run: moon run examples/read_deb --target native
      - name: Check example Debian package with dpkg
        if: runner.os == 'Linux'
        run: dpkg-deb --info examples/data/demo.deb
      - name: Install reference archivers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils llvm clang lld gcc
      - name: Compare with GNU and LLVM
        if: runner.os == 'Linux'
        run: python tools/verify_archives.py --moonar _build/native/debug/build/cmd/main/main.exe --require-llvm
      - name: Verify creation, editing and thin member workflows
        if: runner.os == 'Linux'
        run: python tools/verify_workflow.py --workflow _build/native/debug/build/examples/archive_workflow/archive_workflow.exe --require-llvm
      - name: Verify complete CLI archive editing and real linking
        if: runner.os == 'Linux'
        run: python tools/verify_cli.py --moonar _build/native/debug/build/cmd/main/main.exe --require-llvm
      - name: Verify real zlib regular and thin consumers
        if: runner.os == 'Linux'
        run: python tools/verify_zlib.py --moonar _build/native/debug/build/cmd/main/main.exe --cc gcc
      - name: Verify full and ThinLTO archive consumers
        if: runner.os == 'Linux'
        run: python tools/verify_lto.py --moonar _build/native/debug/build/cmd/main/main.exe
      - name: Check publish package
        run: moon package --list
      - name: Verify packaged public API consumers
        run: python tools/verify_package.py
      - name: Measure checked native workloads
        run: python tools/benchmark.py
      - name: Retain verification and benchmark reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.os }}
          path: _build/verification/
          if-no-files-found: error
          retention-days: 30
